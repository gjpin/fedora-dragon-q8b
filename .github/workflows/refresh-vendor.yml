name: Refresh vendored Dragon Q8B inputs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: dragon-q8b-vendor-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - name: Install refresh tools
        run: |
          dnf -y install \
            bash coreutils curl git git-lfs jq binutils ShellCheck tar xz unzip python3 gh
          repo_root="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset}"
          git config --global --add safe.directory "$repo_root"
          git -C "$repo_root" lfs install --local
          git -C "$repo_root" lfs pull
      - name: Refresh and validate vendored inputs
        run: |
          git fetch origin main
          git switch -C main origin/main
          bash scripts/refresh-vendor.sh --output "$RUNNER_TEMP/current-inputs.env"
          bash scripts/validate-vendor.sh
          shellcheck scripts/*.sh \
            packaging/boot/dragon-q8b-bt-address \
            packaging/boot/dragon-q8b-refresh-boot \
            packaging/boot/dragon-q8b-cmdline \
            packaging/boot/dragon-q8b-thermal \
            packaging/boot/50-dragon-q8b.install \
            packaging/boot/91-dragon-q8b.install \
            packaging/overlays/dragon-q8b-overlay
          git diff --check
      - name: Commit vendor refresh and start build-publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git status --short --untracked-files=all -- \
              vendor config/dragon-q8b.env \
              config/armbian-sc8280xp-edge-patches.sha256 packaging/inputs.lock | \
              grep -q .; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add vendor config/dragon-q8b.env \
              config/armbian-sc8280xp-edge-patches.sha256 packaging/inputs.lock
            git commit -m 'chore: refresh vendored Dragon Q8B inputs'
            git push origin HEAD:main
            sha=$(git rev-parse HEAD)
            echo "Pushed vendor refresh $sha to main"
            # Token pushes do not start other workflows; dispatch explicitly.
            gh workflow run build-publish.yml --ref main
            while IFS= read -r n; do
              [[ -n "$n" ]] || continue
              gh pr close "$n" --comment 'Vendor refresh now lands on main and starts build-publish automatically.'
            done < <(gh pr list --head bot/vendor-refresh --base main --state open --json number --jq '.[].number')
          else
            echo 'Vendored inputs are already current.'
          fi
