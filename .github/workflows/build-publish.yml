name: Build and publish Fedora Dragon Q8B packages

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/build-publish.yml'
      - 'vendor/**'
  pull_request:
    paths:
      - 'config/**'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/build-publish.yml'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to build (auto, all, none, or comma/space-separated list)
        required: false
        default: auto

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container: fedora:44
    env:
      FEDORA_RELEASE: 44
      EVENT_NAME: ${{ github.event_name }}
      KERNEL_BUILD_ID_OVERRIDE: dragonq8b.${{ github.run_number }}.${{ github.run_attempt }}
      PACKAGE_RELEASE_OVERRIDE: 1.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Install Fedora build tools and Git LFS
        run: |
          dnf -y --disablerepo='*openh264*' install \
            bash coreutils git git-lfs findutils grep sed awk \
            fedpkg fedora-packager \
            rpm-build rpmdevtools kernel-rpm-macros python3-devel \
            make gcc flex bison dtc binutils openssl tar gzip xz ShellCheck patch \
            autoconf automake libtool libyaml-devel libbsd-devel systemd-rpm-macros \
            kernel-devel \
            qemu-system-aarch64-core edk2-aarch64 genisoimage qemu-img
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
      - name: Materialize LFS inputs
        run: |
          repo_root="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset}"
          git config --global --add safe.directory "$repo_root"
          git -C "$repo_root" rev-parse --show-toplevel
          git -C "$repo_root" lfs install --local
          git -C "$repo_root" lfs pull
      - name: Validate shell, vendored inputs, and specs
        run: |
          bash scripts/validate-vendor.sh
          shellcheck scripts/*.sh \
            packaging/boot/dragon-q8b-bt-address \
            packaging/boot/dragon-q8b-refresh-boot \
            packaging/boot/dragon-q8b-cmdline \
            packaging/boot/dragon-q8b-thermal \
            packaging/boot/50-dragon-q8b.install \
            packaging/boot/91-dragon-q8b.install \
            packaging/overlays/dragon-q8b-overlay \
            packaging/qnn/dragon-q8b-qnn-sync \
            packaging/qnn/dragon-q8b-qnn.sh
          for spec in packaging/*/*.spec; do
            rpmspec --parse "$spec" >/dev/null
          done
          bash scripts/prepare-kernel-source.sh --help
          bash scripts/build-srpms.sh --help
          bash scripts/detect-affected-packages.sh --help
          bash scripts/validate-e2e.sh --help
          bash scripts/test-e2e-qemu.sh --help
          test "$(wc -l < config/armbian-sc8280xp-edge-patches.list)" -eq \
            "$(wc -l < config/armbian-sc8280xp-edge-patches.sha256)"
      - name: Fetch pull-request base
        if: github.base_ref != ''
        run: git fetch origin "${{ github.base_ref }}" --no-tags
      - name: Detect affected packages
        id: detect_packages
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          pkgs_input="${INPUT_PACKAGES:-auto}"
          if [[ "$pkgs_input" != "auto" ]]; then
            affected=$(bash scripts/detect-affected-packages.sh --packages "$pkgs_input")
          else
            affected=$(bash scripts/detect-affected-packages.sh)
          fi
          echo "affected_packages=$affected" >> "$GITHUB_OUTPUT"
          echo "Affected packages: $affected"
          if [[ -z "$affected" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ " $affected " =~ " kernel " ]]; then
            echo "needs_kernel=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_kernel=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Fedora kernel source
        if: steps.detect_packages.outputs.needs_kernel == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/prepared-kernel"
          bash scripts/prepare-kernel-source.sh \
            --release "$FEDORA_RELEASE" \
            --output "$RUNNER_TEMP/prepared-kernel"
      - name: Check Fedora patch redundancy
        if: steps.detect_packages.outputs.needs_kernel == 'true'
        run: |
          bash scripts/check-patch-redundancy.sh \
            --kernel-dir "$RUNNER_TEMP/prepared-kernel/kernel" \
            --patch-dir "$RUNNER_TEMP/prepared-kernel/dragon-q8b-patches" \
            --patch-list config/armbian-sc8280xp-edge-patches.list \
            --output "$RUNNER_TEMP/prepared-kernel/patch-status.tsv"
      - name: Upload patch redundancy report
        if: always() && steps.detect_packages.outputs.needs_kernel == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-status-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-kernel/patch-status.tsv
          if-no-files-found: ignore
      - name: Build source RPMs
        if: steps.detect_packages.outputs.has_changes == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/srpms"
          build_args=(--release "$FEDORA_RELEASE" --output "$RUNNER_TEMP/srpms" --packages "${{ steps.detect_packages.outputs.affected_packages }}")
          if [[ "${{ steps.detect_packages.outputs.needs_kernel }}" == "true" ]]; then
            build_args+=(--source-dir "$RUNNER_TEMP/prepared-kernel/kernel")
          fi
          bash scripts/build-srpms.sh "${build_args[@]}"
          bash scripts/validate-srpms.sh --rebuild-firmware "$RUNNER_TEMP/srpms"
      - name: Upload source RPMs and metadata
        if: steps.detect_packages.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dragon-q8b-srpms-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/srpms/*.src.rpm
            ${{ runner.temp }}/prepared-kernel/source-metadata.env
            ${{ runner.temp }}/prepared-kernel/patch-status.tsv
            ${{ runner.temp }}/prepared-kernel/armbian-sc8280xp-edge-patches.sha256
          if-no-files-found: ignore
      - name: Build QEMU E2E binary RPMs
        if: env.EVENT_NAME != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-srpms" "$RUNNER_TEMP/e2e-rpms"
          bash scripts/build-srpms.sh \
            --release "$FEDORA_RELEASE" \
            --output "$RUNNER_TEMP/e2e-srpms" \
            --binary-output "$RUNNER_TEMP/e2e-rpms" \
            --packages "dragon-q8b-firmware dragon-q8b-boot dragon-q8b-overlays dragon-q8b-alsa-ucm fastrpc dragon-q8b-qnn dragon-q8b-support"
          ls -l "$RUNNER_TEMP/e2e-rpms"
      - name: Run Fedora QEMU E2E validation
        if: env.EVENT_NAME != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/qemu-e2e"
          bash scripts/test-e2e-qemu.sh \
            --rpm-dir "$RUNNER_TEMP/e2e-rpms" \
            --release "$FEDORA_RELEASE" \
            --output "$RUNNER_TEMP/qemu-e2e" \
            --timeout 1200
      - name: Upload QEMU E2E test logs
        if: always() && env.EVENT_NAME != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-e2e-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/qemu-e2e
          if-no-files-found: ignore
      - name: Configure COPR credentials
        if: github.event_name == 'workflow_dispatch' && steps.detect_packages.outputs.has_changes == 'true'
        env:
          COPR_CONFIG_SECRET: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "$COPR_CONFIG_SECRET" || {
            echo 'COPR_CONFIG GitHub secret is required for publishing' >&2
            exit 1
          }
          umask 077
          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG_SECRET" > "$HOME/.config/copr"
      - name: Publish to COPR
        if: github.event_name == 'workflow_dispatch' && steps.detect_packages.outputs.has_changes == 'true'
        env:
          COPR_OWNER: ${{ secrets.COPR_OWNER }}
        run: |
          test -n "$COPR_OWNER" || {
            echo 'COPR_OWNER GitHub secret is required for publishing' >&2
            exit 1
          }
          dnf -y install copr-cli python3-copr
          bash scripts/submit-copr-builds.sh \
            --project "$COPR_OWNER/dragon-q8b" \
            --chroot "fedora-${FEDORA_RELEASE}-aarch64" \
            --srpm-dir "$RUNNER_TEMP/srpms"
