# Q8B remote processors and display/media firmware must be available before
# the root filesystem is mounted. install_optional_items keeps this config
# compatible with Fedora firmware layouts where a generic blob is absent.
force_drivers+=" qcom_q6v5_pas "
install_optional_items+=" \
 /lib/firmware/qcom/sc8280xp/qccdsp8280.mbn \
 /lib/firmware/qcom/sc8280xp/qcdxkmsuc8280.mbn \
 /lib/firmware/qcom/sc8280xp/qcslpi8280.mbn \
 /lib/firmware/qcom/sc8280xp/qcvss8280.mbn \
 /lib/firmware/qcom/sc8280xp/qupv3fw.elf \
 /lib/firmware/qcom/sc8280xp/radxa/dragon-q8b/qcadsp8280.mbn \
 /lib/firmware/qcom/vpu/vpu20_p4_gen2_s6.mbn \
 /lib/firmware/qcom/sc8280xp/LENOVO/21BX/qcdxkmsuc8280.mbn \
 /lib/firmware/qcom/a660_sqe.fw \
 /lib/firmware/qcom/a660_gmu.bin"

