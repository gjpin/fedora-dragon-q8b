# Configuration for Radxa Dragon Q8B thermal governor and cooling policy
#
# Default is fanless (power_allocator). Set AUTO_PWM_FAN=1 to use step_wise
# only on thermal zones that list a pwm-fan cooling device after
# `dragon-q8b-overlay enable pwm-fan` and a reboot (Heatsink 6845B).
#
# dragon-q8b-thermal -m POLICY -p writes GOVERNOR= and AUTO_PWM_FAN=0.
#
# Supported policies:
#   power_allocator  - Passive cooling / fanless or fixed DC fan [Default]
#   step_wise        - Active cooling with PWM fan / heatsink
#   user_space       - Manual fan speed & cooling device control
#   fair_share       - Proportional load distribution across cooling devices
#   bang_bang        - Two-point threshold cooling
#
GOVERNOR=power_allocator
AUTO_PWM_FAN=1
