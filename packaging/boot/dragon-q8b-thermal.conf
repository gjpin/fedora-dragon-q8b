# Configuration for Radxa Dragon Q8B thermal governor policy
#
# Active cooling (Heatsink 6845B PWM fan) is managed autonomously by firmware
# running on the Qualcomm Hexagon ADSP (qcadsp8280.mbn) inside the SC8280XP SoC.
# If ADSP firmware is not loaded, the fan runs at full speed as a fail-safe.
#
# This file sets the Linux thermal governor for SoC thermal mitigation/throttling.
# Update with: dragon-q8b-thermal -m POLICY -p
#
# Supported policies:
#   power_allocator  - Passive cooling / thermal throttling [Default]
#   step_wise        - Step-wise thermal throttling
#   user_space       - Userspace thermal control
#   fair_share       - Proportional load distribution across cooling devices
#   bang_bang        - Two-point threshold cooling
#
GOVERNOR=power_allocator
