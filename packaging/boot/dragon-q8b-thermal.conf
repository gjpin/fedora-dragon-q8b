# Configuration for Radxa Dragon Q8B thermal governor and cooling policy
#
# Supported policies:
#   step_wise        - Active cooling with dynamic PWM fan curve [Default / Recommended]
#   power_allocator  - Passive cooling / fanless or fixed DC fan
#   user_space       - Manual fan speed & cooling device control
#   fair_share       - Proportional load distribution across cooling devices
#   bang_bang        - Two-point threshold cooling
#
GOVERNOR=step_wise
