# Default Dragon Q8B kernel command line. systemd kernel-install concatenates
# /usr/lib/kernel/cmdline.d/*.conf.
#
# Only clk_ignore_unused is applied by default. Optional, hardware-tested
# drop-ins (install a higher-numbered file under /etc/kernel/cmdline.d/):
#   pd_ignore_unused
#   arm64.nopauth
#   efi=noruntime
clk_ignore_unused
